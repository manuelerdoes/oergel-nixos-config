# Mango config. Linked to ~/.config/mango/config.conf by home.nix.
# Mango reloads it when you save. Check it from a terminal with:
#   mango -c ~/.config/mango/config.conf -p
#
# Reference: https://mangowm.github.io  (or /etc/mango/config.conf)
# Mango is based on dwl (dwm for Wayland), so most of your dwm binds map 1:1.

# ==============================================================================
# Autostart
exec_once=noctalia
# Shows the VPN login window and remembers it (NetworkManager secret agent)
exec_once=nm-applet --indicator
# Remote desktop, only reachable through an SSH tunnel (127.0.0.1)
exec_once=wayvnc 127.0.0.1 5900
# VMware copy-paste (VM only; on the notebook it just fails silently)
exec_once=vmware-user-suid-wrapper

# ==============================================================================
# Keyboard (Swiss German; "us" for US)
xkb_rules_layout=ch
xkb_rules_variant=de_nodeadkeys
repeat_rate=25
repeat_delay=600
numlock_on=1

# Trackpad (needs a re-login to apply)
tap_to_click=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1

# ==============================================================================
# Layouts
# Same defaults as dwm: tile, new window becomes master, mfact 0.55, 9 tags.
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9

tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# What Mod+Space cycles through
circle_layout=tile,scroller

monocle_tab_mode=1
scroller_default_proportion=0.8
scroller_proportion_preset=0.5,0.8,1.0

# ==============================================================================
# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
border_px=2
border_radius=10
focus_color=0xc9b890ff
border_color=0x444444ff

# Blur behind windows, not behind Noctalia's bar (values from Noctalia's docs).
# Blur needs a GPU. If the VM is slow, set blur=0.
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0

# Window shadows. Noctalia draws its own, so layer shadows stay off.
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadows_color=0x000000ff

animations=1
layer_animations=0

# Focus follows the mouse, like dwm
sloppy_focus=1
warp_cursor=1
cursor_size=24

# ==============================================================================
# Window rules
window_rule=is_floating:1,width:1020,height:900,app_id:dev.noctalia.Noctalia

# ==============================================================================
# Keybinds
# Format: bind=MODIFIERS,KEY,COMMAND,PARAMETERS
# Keys are matched by position, so they keep working on any layout.

# --- Launchers (dwm: dmenu, termcmd, browsercmd, explorercmd) ----------------
bind=SUPER,p,spawn,noctalia msg panel-toggle launcher
bind=SUPER+SHIFT,Return,spawn,kitty
bind=SUPER,w,spawn,zen-beta
bind=SUPER,n,spawn,nautilus

# --- Shell (Noctalia) ---------------------------------------------------------
bind=SUPER,b,spawn,noctalia msg bar-toggle
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER+SHIFT,s,spawn,noctalia msg screenshot-region
bind=SUPER,Escape,spawn,noctalia msg panel-toggle session

# --- Stack (dwm: focusstack, incnmaster, setmfact, zoom) ----------------------
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
bind=SUPER,i,incnmaster,+1
bind=SUPER,d,incnmaster,-1
bind=SUPER,h,setmfact,-0.05
bind=SUPER,l,setmfact,+0.05
bind=SUPER,Return,zoom

# Extras: move windows in the stack, directional focus
bind=SUPER+SHIFT,j,exchange_stack_client,next
bind=SUPER+SHIFT,k,exchange_stack_client,prev
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down

# --- Layouts (dwm: tile / floating / monocle) ---------------------------------
bind=SUPER,t,setlayout,tile
# Mango has no floating layout; this floats every window on the tag instead.
bind=SUPER,f,toggle_all_floating
bind=SUPER,m,setlayout,monocle
bind=SUPER,y,setlayout,dwindle
bind=SUPER,space,switch_layout
bind=SUPER+SHIFT,space,togglefloating
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER+CTRL,f,togglemaximizescreen
bind=SUPER,r,switch_proportion_preset

# Scroller layout: move a window into or out of the neighbouring stack.
bind=SUPER+CTRL,Left,scroller_stack,left
bind=SUPER+CTRL,Right,scroller_stack,right

# --- Windows & session --------------------------------------------------------
# Close window (dwm had Mod+Shift+C)
bind=SUPER,q,killclient
# Quits immediately, with no confirmation (like dwm).
bind=SUPER+SHIFT,q,quit
bind=SUPER+CTRL,r,reload_config

# --- Tags (dwm: view / tag / toggleview / toggletag) --------------------------
bind=SUPER,Tab,view,-1
bind=SUPER,0,view,00
bind=SUPER+SHIFT,0,tag,1|2|3|4|5|6|7|8|9
bind=SUPER,o,toggleoverview

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9

bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9

bind=SUPER+CTRL+SHIFT,1,toggletag,1
bind=SUPER+CTRL+SHIFT,2,toggletag,2
bind=SUPER+CTRL+SHIFT,3,toggletag,3
bind=SUPER+CTRL+SHIFT,4,toggletag,4
bind=SUPER+CTRL+SHIFT,5,toggletag,5
bind=SUPER+CTRL+SHIFT,6,toggletag,6
bind=SUPER+CTRL+SHIFT,7,toggletag,7
bind=SUPER+CTRL+SHIFT,8,toggletag,8
bind=SUPER+CTRL+SHIFT,9,toggletag,9

# --- Monitors (dwm: focusmon / tagmon) ----------------------------------------
bind=SUPER,comma,focusmon,prev
bind=SUPER,period,focusmon,next
bind=SUPER+SHIFT,comma,tagmon,prev
bind=SUPER+SHIFT,period,tagmon,next

# --- Scratchpad (the § key, left of 1) ----------------------------------------
# code:49 is that key's keycode; the name "section" doesn't resolve reliably.
bind=SUPER,code:49,toggle_scratchpad
bind=SUPER+SHIFT,code:49,minimized

# --- Media keys, through Noctalia so its OSD shows (l = works when locked) ---
bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bindl=NONE,XF86AudioNext,spawn,noctalia msg media next
bindl=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bindl=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bindl=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# --- Mouse (dwm: Mod+drag to move / resize) -----------------------------------
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
