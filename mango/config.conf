# Mango config for normal sessions. Linked to ~/.config/mango/config.conf by
# home.nix. Auto-reload does not see edits made through the symlink: press
# Super+Ctrl+R after saving. Check it from a terminal with:
#   mango -c ~/.config/mango/config.conf -p
#
# All settings and keybinds are in settings.conf. This file only adds what
# starts with a normal login (remote-desktop has its own autostart).
source=~/.config/mango/settings.conf

# ==============================================================================
# Autostart
exec_once=noctalia
# Shows the VPN login window and remembers it (NetworkManager secret agent)
exec_once=nm-applet --indicator
# Remote desktop, only reachable through an SSH tunnel (127.0.0.1).
# wayvnc-screencopy: wayvnc patched for Mango (see configuration.nix).
exec_once=wayvnc-screencopy 127.0.0.1 5900
# VMware copy-paste (VM only; on the notebook it just fails silently)
exec_once=vmware-user-suid-wrapper

switchbind=fold,spawn,/home/merdoes/.config/mango/lid.sh
switchbind=unfold,spawn,/home/merdoes/.config/mango/lid.sh
exec_once=/home/merdoes/.config/mango/lid.sh
