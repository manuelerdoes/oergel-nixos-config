# Umbriel config. Linked to ~/.config/umbriel/config.toml by home.nix.
# Saving this file reloads Umbriel right away. Errors appear on screen.
# Check it from a terminal with:  umbriel config validate
#
# Reference: https://docs.noctalia.dev/umbriel/
# Based on Umbriel's examples/config.toml, with dwm-style keybinds.

# ==============================================================================
# General
[general]
# vmware-user: VMware copy-paste (VM only; on the notebook it just fails silently)
autostart = ["noctalia", "vmware-user-suid-wrapper"]
# "Super" (Windows key). If the VM host captures the Windows key, switch to "Alt"
# for testing.
mod_key = "Super"
# Shows the active keybinds at startup. Turn this off once you know them.
show_cheatsheet = true

# ==============================================================================
# Outputs
# Run `umbriel outputs` inside the session to see the monitor names
# (in a VM usually "Virtual-1").
#
# Workspaces are dynamic by default: an empty one is always at the end, and
# unused ones disappear. For a fixed set of 9 like dwm's tags, uncomment this:
# [output.Virtual-1]
# workspaces = 9
#
# [output.eDP-1]          # notebook panel
# scale = 1.25

# ==============================================================================
# Appearance (values from the Noctalia docs for Umbriel)
[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 10

# Blur needs a GPU. If the VM is slow, set enabled = false.
[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

# ==============================================================================
# Input
[input.keyboard]
# Swiss German; "us" for US
layout = "ch"
variant = "de_nodeadkeys"
numlock_toggle = true

# [input.focus]
# follows_mouse = true

# ==============================================================================
# Layout
# "master" behaves like dwm's tile layout. Umbriel's own default is
# "scrolling" (niri style). Mod+M switches a workspace to it.
[layout]
mode = "master"
gap = 8
extent_presets = [0.333, 0.5, 0.667, 1.0]

[layout.master]
position = "left"
default_width_fraction = 0.55 # dwm's mfact
new_becomes_master = true # dwm puts new windows in the master area

[layout.scrolling]
default_extent_fraction = 0.5

# ==============================================================================
# Keybinds
# Defining this table REPLACES all built-in binds, so everything you want has
# to be listed here. Actions: https://docs.noctalia.dev/umbriel/actions/
[keybinds]

# --- Launchers (dwm: dmenu, termcmd, browsercmd, explorercmd) ----------------
"Mod+P" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Mod" = "spawn:noctalia msg panel-toggle launcher" # tap Super alone
"Mod+Shift+Return" = { action = "spawn:kitty", repeat = false }
"Mod+W" = { action = "spawn:zen-beta", repeat = false }
"Mod+N" = { action = "spawn:nautilus", repeat = false }

# --- Shell (Noctalia) ---------------------------------------------------------
"Mod+B" = "spawn:noctalia msg bar-toggle" # dwm: togglebar
"Mod+S" = "spawn:noctalia msg panel-toggle control-center"
"Mod+V" = "spawn:noctalia msg panel-toggle clipboard"
"Mod+Shift+S" = "spawn:noctalia msg screenshot-region"
"Mod+Escape" = "spawn:noctalia msg panel-toggle session" # lock / logout / reboot

# --- Focus (dwm: focusstack) --------------------------------------------------
"Mod+J" = "window-focus-next"
"Mod+K" = "window-focus-previous"
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"

# Move windows in the stack. Not in stock dwm (the "movestack" patch).
"Mod+Shift+J" = "window-swap-next"
"Mod+Shift+K" = "window-swap-previous"
"Mod+Shift+Left" = "window-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "window-move-right"

# --- Master area (dwm: incnmaster, setmfact, zoom) ----------------------------
"Mod+I" = "layout-master-count-increase"
"Mod+D" = "layout-master-count-decrease"
# In master: resizes the master area. In scrolling: resizes the column.
"Mod+H" = "window-modify-primary-extent:-0.05"
"Mod+L" = "window-modify-primary-extent:0.05"
# Close to zoom: swaps a stack window with the master to its left.
"Mod+Return" = { action = "window-swap-left", repeat = false }

# --- Layouts (dwm: tile / floating / monocle) ---------------------------------
"Mod+T" = { action = "workspace-set-layout:master", repeat = false }
"Mod+F" = { action = "workspace-set-layout:floating", repeat = false }
"Mod+M" = { action = "workspace-set-layout:scrolling", repeat = false }
"Mod+Y" = { action = "workspace-set-layout:dwindle", repeat = false }
"Mod+Space" = { action = "workspace-set-layout:toggle:master,scrolling", repeat = false }
"Mod+Shift+Space" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+R" = "window-cycle-primary-extent" # cycles column width in scrolling
"Mod+Shift+W" = { action = "column-toggle-tabbed", repeat = false }

# Scrolling layout: move a window into or out of the column next to it.
"Mod+Ctrl+Left" = "window-consume-or-expel-left"
"Mod+Ctrl+Right" = "window-consume-or-expel-right"

# --- Windows & session --------------------------------------------------------
"Mod+Shift+C" = { action = "window-close", repeat = false } # dwm: killclient
"Mod+Shift+Q" = "session-quit" # asks for confirmation
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+F1" = { action = "cheatsheet-toggle", repeat = false }

# --- Workspaces (dwm: view / tag) ---------------------------------------------
"Mod+Tab" = "workspace-focus-last" # dwm: view previous tagset
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+0" = { action = "overview-toggle", repeat = false } # dwm: view all tags
"Mod+Shift+0" = { action = "window-toggle-pinned", repeat = false } # roughly: on all tags
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }

"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
# dwm's tag does not follow the window, so these are the silent variants.
"Mod+Shift+1" = "window-move-to-workspace-silent:1"
"Mod+Shift+2" = "window-move-to-workspace-silent:2"
"Mod+Shift+3" = "window-move-to-workspace-silent:3"
"Mod+Shift+4" = "window-move-to-workspace-silent:4"
"Mod+Shift+5" = "window-move-to-workspace-silent:5"
"Mod+Shift+6" = "window-move-to-workspace-silent:6"
"Mod+Shift+7" = "window-move-to-workspace-silent:7"
"Mod+Shift+8" = "window-move-to-workspace-silent:8"
"Mod+Shift+9" = "window-move-to-workspace-silent:9"

# --- Monitors (dwm: focusmon / tagmon) ----------------------------------------
"Mod+Comma" = "output-focus-previous"
"Mod+Period" = "output-focus-next"
"Mod+Shift+Comma" = "window-move-to-output-previous"
"Mod+Shift+Period" = "window-move-to-output-next"

# --- Scratchpad (the § key, left of 1) ----------------------------------------
"Mod+section" = "scratchpad-toggle"
"Mod+Shift+section" = { action = "window-move-to-scratchpad", repeat = false }

# --- Media keys, routed through Noctalia so its OSD shows ---------------------
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn:noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn:noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down", allow_when_locked = true }

# ==============================================================================
# Window rules
[[window_rule]]
blur = true

# Noctalia's settings window
[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

# Screen-share picker
[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# ==============================================================================
# Layer rules: blur behind Noctalia's bar, panels and notifications
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

# ==============================================================================
# Overview: rest the pointer in the top-left corner
[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"
